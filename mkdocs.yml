site_name: Vault Self-Service Portal
site_description: Documentation for the Vault Self-Service IDP built on Backstage and HCP Terraform
docs_dir: pages
site_dir: _site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - Template Cards:
      - Overview: cards/index.md
      - "L0 — Tenant Onboarding (Admin)": cards/admin-onboarding.md
      - "L1 — Trust Onboarding": cards/trust-onboarding.md
      - "L2 — Workload Onboarding": cards/workload-onboarding.md
      - "L3 — Use-case Onboarding": cards/usecase-onboarding.md
  - Terraform Modules:
      - Overview: modules/index.md
      - Trust Layer:
          - Cluster Onboarding: modules/cluster-onboarding.md
          - GitLab Onboarding: modules/gitlab-onboarding.md
          - HCP TF Onboarding: modules/hcptf-onboarding.md
      - Workload Layer:
          - K8s Namespace Access: modules/add-k8s-namespace-access.md
          - GitLab Project Access: modules/add-gitlab-project-access.md
      - Use-case Layer:
          - KV v2 Access: modules/add-kvv2.md
          - PostgreSQL Role: modules/add-pgsql-role.md
          - Permission Group: modules/add-permission-group.md
          - PostgreSQL Connection: modules/pgsql-onboarding.md
