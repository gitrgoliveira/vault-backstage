apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: terraform-vault-cluster-onboarding
  description: Creates a Vault JWT auth backend for Kubernetes/OpenShift cluster trust.
  tags: [terraform, vault, onboarding, trust]
  annotations:
    backstage.io/techdocs-ref: dir:../docs/terraform-vault-cluster-onboarding
    hcptf.io/module-name: terraform-vault-cluster-onboarding
    hcptf.io/layer: trust
    hcptf.io/outputs: jwt_auth_path,jwt_mount_accessor
spec:
  type: terraform-module
  lifecycle: production
  owner: group:default/vault-platform
  system: vault-trust
