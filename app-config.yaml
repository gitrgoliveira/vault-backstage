app:
  title: Vault Self-Service Portal
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /
    # Default the catalog list filter to "all" instead of "owned". With guest/dev
    # auth the signed-in user owns nothing, so the "owned" default renders an
    # empty catalog even though entities exist.
    - catalog-filter:catalog/list:
        config:
          initialFilter: all

organization:
  name: Vault Self-Service Portal

hcpTerraform:
  organization: ${HCP_TF_ORGANIZATION}
  baseUrl: ${HCP_TF_BASE_URL:-https://app.terraform.io}
  token: ${HCP_TF_TOKEN}
  projects:
    # Placeholders {tenant} and {env} are substituted by the backend at resolve time.
    # (Do NOT use ${...} here — Backstage would treat it as an env-var reference.)
    namingPattern: "{tenant}-Vault-{env}"
    tenantTagKey: ${HCP_TF_TENANT_TAG_KEY:-tenant}
    # Admin project holding the tenant-onboarding workspaces. Onboarded tenants
    # are discovered from those workspaces' project_ids/project_names outputs.
    adminProjectName: ${HCP_TF_ADMIN_PROJECT_NAME:-HCP Vault Admin}
    # Optionally pin the admin project by ID (prj-xxxx) instead of by name:
    # adminProjectId: ${HCP_TF_ADMIN_PROJECT_ID}
    environments:
      - dev
      - test
      - prod
    # Tag-binding that marks a project as a Vault onboarding project.
    productTag:
      key: Product
      value: Vault
  audit:
    requestedByTagKey: ${HCP_TF_REQUESTED_BY_TAG_KEY:-requested-by}
  # moduleMap pre-populates the module-name -> nocode-xxx ID mapping.
  # Obtain these from your HCP TF org after enabling no-code on each module.
  # If omitted the client will attempt API resolution at runtime (requires list permission).
  # moduleMap:
  #   terraform-vault-cluster-onboarding: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-gitlab-onboarding: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-add-k8s-namespace-access: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-add-gitlab-project-access: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-add-kvv2: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-add-pgsql-role: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-add-permission-group: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-pgsql-onboarding: nocode-xxxxxxxxxxxxxxxx
  #   terraform-vault-hcptf-onboarding: nocode-xxxxxxxxxxxxxxxx
  # actions:
  #   # Register the hcptf:run:create destroy action. It has NO per-owner
  #   # authorization check; only enable it alongside a template that gates
  #   # destruction to the workspace owner. Default: false.
  #   enableDestroy: false

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'local' # 'local' uses host mkdocs (run `make docs-deps`); 'docker' needs Docker
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  environment: development
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
    # GitLab SSO. Activates when AUTH_GITLAB_* env vars are provided.
    # Uncomment to enable real sign-in (keep guest for local dev only).
    # gitlab:
    #   development:
    #     clientId: ${AUTH_GITLAB_CLIENT_ID}
    #     clientSecret: ${AUTH_GITLAB_CLIENT_SECRET}
    #     audience: ${AUTH_GITLAB_BASE_URL}
    #     signIn:
    #       resolvers:
    #         - resolver: usernameMatchingUserEntityName
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  experimentalClientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User]
  locations:
    # Local IDP catalog definitions. File locations are relative to packages/backend.
    - type: file
      target: ../../catalog/domain-and-systems.yaml

    - type: file
      target: ../../catalog/modules.yaml

    # Local scaffolder templates (3 layer templates + admin onboarding)
    - type: file
      target: ../../templates/vault-trust/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/vault-principal/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/vault-usecase/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/vault-admin-onboarding/template.yaml
      rules:
        - allow: [Template]

    # Local organizational data
    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'Vault Self-Service Portal' # defaults to "backstage"
  description: 'Tools for provisioning Vault access, browsing the catalog, and managing infrastructure via Terraform no-code modules' # optional
